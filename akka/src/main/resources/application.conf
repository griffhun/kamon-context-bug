akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "WARNING"
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
  actor {
    provider = cluster
    allow-java-serialization = on
    warn-about-java-serializer-usage = off
  }
  remote.artery.canonical.hostname = "127.0.0.1"
  cluster {
    seed-nodes = ["akka://repro@127.0.0.1:25520"]
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
    jmx.multi-mbeans-in-same-jvm = on
    # default is 10s; shorter so a 40s run sees many keep-alive ticks
    sharded-daemon-process.keep-alive-interval = 2s
  }
  coordinated-shutdown.exit-jvm = off
}

kamon {
  trace.sampler = always
  trace.tick-interval = 1 second
  init.hide-banner = yes
  modules {
    status-page.enabled = no
    host-metrics.enabled = no
    process-metrics.enabled = no
    jvm-metrics.enabled = no
  }
}
