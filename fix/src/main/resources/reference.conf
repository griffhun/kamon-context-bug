# The proposed fix (fix/src/main/scala/fix/ArteryContextFix.scala); it advises nothing unless FIX is set
kanela.modules {
  akka-artery-context-fix {
    name = "Akka Artery context fix"
    description = "Reset pooled inbound envelopes; serialize each message under its own envelope's context"
    instrumentations = ["fix.AkkaArteryContextFix"]
    # Kanela 1.x (Kamon 2.7) reads regexes, Kanela 2.x (Kamon 2.8) reads package prefixes; each ignores the other's entry
    within = ["akka.remote..*", "akka.remote."]
  }

  pekko-artery-context-fix {
    name = "Pekko Artery context fix"
    description = "Reset pooled inbound envelopes; serialize each message under its own envelope's context"
    instrumentations = ["fix.PekkoArteryContextFix"]
    within = ["org.apache.pekko.remote..*", "org.apache.pekko.remote."]
  }
}
