# Minimal reproduction (ArteryContextSpec): two plain remoting systems, no cluster
pekko {
  # ERROR: the remoting connections log WARNs when the systems shut down
  loglevel = "ERROR"
  actor.provider = remote
  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 0
  }
}

kamon {
  trace.sampler = always
  init.hide-banner = yes
  modules {
    status-page.enabled = no
    host-metrics.enabled = no
    process-metrics.enabled = no
    jvm-metrics.enabled = no
  }
}
